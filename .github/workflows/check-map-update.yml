# Poll Google My Maps KMZ; dispatch Pages deploy when the published hash differs.
name: Check My Maps update

on:
  schedule:
    # Every hours (UTC). GitHub may delay scheduled runs on busy hosts.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: check-map-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Read KMZ hash from live site track-meta.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url' 2>/dev/null || true)"
          SITE="${SITE%/}"
          if [ -z "$SITE" ]; then
            echo "LAST_KMZ_SHA256=" >> "$GITHUB_ENV"
            exit 0
          fi
          META_URL="${SITE}/data/track-meta.json"
          JSON="$(curl -fsSL "${META_URL}?t=$(date +%s)" || true)"
          if [ -n "$JSON" ]; then
            HASH="$(node -p "JSON.parse(process.argv[1]).kmzSha256" "$JSON")"
            echo "LAST_KMZ_SHA256=$HASH" >> "$GITHUB_ENV"
          else
            echo "LAST_KMZ_SHA256=" >> "$GITHUB_ENV"
          fi

      - name: Compare KMZ hash to published baseline
        id: kmz
        env:
          LAST_KMZ_SHA256: ${{ env.LAST_KMZ_SHA256 }}
        run: npx tsx scripts/check-kmz-update.ts

      - name: Trigger Pages deploy
        if: steps.kmz.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "KMZ changed (${{ steps.kmz.outputs.remote_sha256 }}); dispatching Pages deploy."
          gh workflow run "Deploy Vite React site to Pages" --ref master

      - name: No map changes
        if: steps.kmz.outputs.changed != 'true'
        run: echo "KMZ unchanged; skipping deploy."
